<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MOCK 顶层页面（模拟超星 studentstudy）</title>
<style>
  body { margin:0; font:14px "Microsoft YaHei",sans-serif; display:flex; height:100vh; }
  #left { flex:1; display:flex; }
  #iframe { flex:1; border:0; }
  #right { width:280px; border-left:1px solid #ddd; padding:10px; overflow:auto; }
  .posCatalog_level { padding:2px 0; }
  .posCatalog_select { display:block; padding:6px 8px; border-radius:6px; cursor:pointer; color:#333; }
  .posCatalog_select:hover { background:#f2f4f7; }
  .posCatalog_active { background:#e8f2ff; color:#0d6efd; font-weight:700; }
  .posCatalog_name { pointer-events:none; }
  h3 { margin:0 0 8px; font-size:13px; color:#888; }
</style>
</head>
<body>
  <input type="hidden" id="curChapterId" value="1001">
  <div id="left"><iframe id="iframe" src="about:blank"></iframe></div>
  <div id="right">
    <h3>目录</h3>
    <div id="cat"></div>
  </div>

<script>
  var CHAPTERS = [
    { id: 1001, name: '1.1 导论' },
    { id: 1002, name: '1.2 国家安全概述' },
    { id: 1003, name: '2.1 国防历史的启示' },
    { id: 1004, name: '2.2 国防法规体系' }
  ];

  var cat = document.getElementById('cat');
  CHAPTERS.forEach(function (ch, i) {
    var level = document.createElement('div');
    level.className = 'posCatalog_level';

    var sel = document.createElement('span');
    sel.className = 'posCatalog_select';
    sel.setAttribute('chapterid', String(ch.id));
    sel.innerHTML = '<span class="posCatalog_name">' + ch.name + '</span>';
    sel.addEventListener('click', function () { activate(i); });

    level.appendChild(sel);
    cat.appendChild(level);
  });

  window.__activated = [];

  function activate(i) {
    window.__activated.push(CHAPTERS[i].name);
    document.querySelectorAll('.posCatalog_select').forEach(function (n) {
      n.classList.remove('posCatalog_active');
    });
    document.querySelectorAll('.posCatalog_select')[i].classList.add('posCatalog_active');
    document.getElementById('curChapterId').value = CHAPTERS[i].id;
    // 模拟超星：切换章节 = 重载第一层内嵌 iframe（注意顶层不动，URL 也不变）
    document.getElementById('iframe').src = 'layer1.html?n=' + (i + 1);
  }

  /* 供 layer2 调用：把"当前激活的目录节点"标记为已完成（模拟超星任务点完成） */
  window.markActiveComplete = function () {
    var act = document.querySelector('.posCatalog_select.posCatalog_active') ||
              document.querySelector('.posCatalog_active');
    if (act) act.classList.add('complete');
  };

  activate(0);
</script>
</body>
</html>

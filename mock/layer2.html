<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>layer2 - 播放器</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font:14px "Microsoft YaHei",sans-serif;position:relative}
  .tabs{display:flex;gap:6px;padding:8px 10px;background:#1c1c1c}
  .tab{padding:5px 12px;border-radius:4px;background:#2a2a2a;color:#bbb;cursor:pointer}
  .tab.on{background:#3b6ea5;color:#fff}
  .pane{padding:0 10px}
  #pane-basic{height:70%;background:#333;display:flex;align-items:center;justify-content:center;color:#999}
  video{width:100%;height:70%;background:#000;object-fit:contain}
  #hud{padding:8px 12px;color:#8f8}
  /* 视频内弹题（模拟超星 ans-videoquiz） */
  #vq{display:none;position:absolute;left:12px;top:80px;width:300px;background:#fff;color:#222;
      border:1px solid #ccc;border-radius:8px;padding:12px;z-index:50;font-size:13px}
  #vq .qtitle{font-weight:700;margin-bottom:8px}
  #vq label{display:block;padding:4px 0;cursor:pointer}
  #vq .ans-videoquiz-submit{margin-top:10px;padding:6px 16px;border:0;border-radius:6px;
      background:#1a7f37;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="tabs" id="tabs">
    <span class="tab" data-i="0">1 基础知识</span>
    <span class="tab" data-i="1">2 文档</span>
    <span class="tab" data-i="2">3 视频</span>
    <span class="tab" data-i="3">4 章节测验</span>
  </div>

  <div class="pane" id="pane-basic">基础知识内容（默认落在这里）</div>
  <div class="pane" id="pane-video" style="display:none">
    <video id="v"></video>
    <div id="hud">--</div>
    <!-- 模拟超星「任务点」完成条件面板：智能模式从这里读本视频的完成阈值（如 ≥90%） -->
    <div id="taskpoint-panel" style="padding:6px 12px;color:#666;font-size:12px;">
      任务点 <span style="color:#f5a623;">●</span> 完成条件 观看时长需 ≥ 总时长的 90%（未完成任务点前，当前视频不可倍速）
    </div>
  </div>
  <div class="pane" id="pane-quiz" style="display:none">章节测验内容</div>

  <!-- 视频内弹题：奇数节=单选(radio)，偶数节=多选(checkbox)，选项由 JS 动态生成 -->
  <div id="vq">
    <div class="qtitle" id="vq-title">视频内弹题</div>
    <div class="ans-videoquiz-opts" id="vq-opts"></div>
    <button class="ans-videoquiz-submit">提交</button>
  </div>

<script>
  var n = new URLSearchParams(location.search).get('n') || '1';
  var v = document.getElementById('v');
  v.setAttribute('src', 'mock-ch' + n + '.mp4');

  /* ---------- 弹题模式：奇数节=单选(radio)，偶数节=多选(checkbox) ---------- */
  var MODE = (Number(n) % 2 === 1) ? 'single' : 'multi';
  var SINGLE_CORRECT = '2';        // 单选正确答案 = 选项 C
  var MULTI_CORRECT = ['0', '2'];  // 多选正确答案 = 选项 A + C
  (function () {
    var title = document.getElementById('vq-title');
    if (title) title.textContent = (MODE === 'single') ? '视频内弹题（单选题）' : '视频内弹题（多选题）';
    var html = '';
    for (var oi = 0; oi < 3; oi++) {
      var type = (MODE === 'single') ? 'radio' : 'checkbox';
      html += '<label><input type="' + type + '" name="ans-videoquiz-opt" value="' + oi + '"> 选项 ' + String.fromCharCode(65 + oi) + '</label>';
    }
    var box = document.getElementById('vq-opts');
    if (box) box.innerHTML = html;
  })();

  /* ---------- 任务点标签页 ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function showTab(i) {
    tabs.forEach(function (t, k) { t.classList.toggle('on', k === i); });
    document.getElementById('pane-basic').style.display = (i === 0) ? 'flex' : 'none';
    document.getElementById('pane-video').style.display = (i === 2) ? 'block' : 'none';
    document.getElementById('pane-quiz').style.display  = (i === 3) ? 'block' : 'none';
    window.__tab = i;
  }
  tabs.forEach(function (t, k) { t.addEventListener('click', function () { showTab(k); }); });
  /* 奇数节默认落在「基础知识」（视频要手动点进去），偶数节直接进视频 */
  showTab((Number(n) % 2 === 1) ? 0 : 2);

  /* ---------- 假视频：进度用 Date.now() 算，不受后台节流影响 ---------- */
  var DUR = 8, MS_PER_SEC = 125, accum = 0, segStart = 0;
  function segElapsed() { return segStart ? (Date.now() - segStart) / MS_PER_SEC : 0; }
  function elapsed() { return accum + segElapsed(); }

  Object.defineProperty(v, 'duration',    { get: function () { return DUR; } });
  Object.defineProperty(v, 'currentTime', { get: function () { return Math.min(DUR, elapsed()); }, set: function () {} });
  Object.defineProperty(v, 'paused',      { get: function () { return segStart === 0; } });
  Object.defineProperty(v, 'ended',       { get: function () { return segStart !== 0 && elapsed() >= DUR; } });

  window.__playCalls = 0;
  window.__tabClicks = 0;
  v.play  = function () { window.__playCalls++; if (segStart === 0) segStart = Date.now(); return Promise.resolve(); };
  v.pause = function () { if (segStart !== 0) { accum += segElapsed(); segStart = 0; } };

  document.getElementById('tabs').addEventListener('click', function () { window.__tabClicks++; });

  /* ---------- 视频内弹题模拟 ---------- */
  var vq = document.getElementById('vq');
  window.__quizShown = false;
  window.__quizSolved = false;
  window.__quizLog = [];   // 记录每次「提交」时选中的 value（多选记成 "0,2" 形式）

  document.querySelector('#vq .ans-videoquiz-submit').addEventListener('click', function () {
    if (vq.style.display === 'none') return;           // 已作答成功，忽略重复 click
    var checked = Array.prototype.slice.call(
      vq.querySelectorAll('input[name="ans-videoquiz-opt"]:checked'));
    if (!checked.length) { alert('请选择一个答案'); return; }
    var vals = checked.map(function (i) { return i.value; }).sort();
    window.__quizLog.push(vals.join(','));
    var correct;
    if (MODE === 'single') {
      correct = (vals.length === 1 && vals[0] === SINGLE_CORRECT);
    } else {
      correct = (vals.length === MULTI_CORRECT.length) &&
                MULTI_CORRECT.every(function (v2) { return vals.indexOf(v2) !== -1; });
    }
    if (correct) {
      vq.style.display = 'none';
      window.__quizSolved = true;
      v.play();                                        // 答对 → 恢复播放
    } else {
      alert('答案错误，请重试');                        // 答错 → 模拟平台原生 alert
    }
  });

  function maybeShowQuiz() {
    if (!window.__quizShown && !window.__quizSolved && v.currentTime >= 3) {
      window.__quizShown = true;
      v.pause();                                       // 弹出弹题时暂停视频
      vq.style.display = 'block';
    }
  }

  window.__state = function () {
    return {
      n: n, mode: MODE, tab: window.__tab, t: v.currentTime, paused: v.paused, ended: v.ended,
      playCalls: window.__playCalls, quizShown: window.__quizShown,
      quizSolved: window.__quizSolved, quizLog: window.__quizLog.slice()
    };
  };

  setInterval(function () {
    /* 视频真正结束后：平台**延迟 2 秒**才把「任务点」标记为完成（模拟超星落库延迟，
       即"视频播完了、页面还没显示完成"的那段窗口）。脚本智能模式必须等这个显式信号才切。 */
    if (v.ended && !window.__completeAt) window.__completeAt = Date.now() + 2000;
    if (window.__completeAt && !window.__markedComplete && Date.now() >= window.__completeAt) {
      window.__markedComplete = true;
      try {
        var top = window.parent && window.parent.parent;
        /* 真站：平台落库完成后，**顶部标题区**出现"✓ 任务点已完成"（与视频旁的阈值小面板是两个元素）。
           注意这里**不改** #taskpoint-panel —— 它保持"未完成任务点前…"，以验证完成检测确实靠
           顶部横幅、而不是靠阈值面板的文案。 */
        if (top && top.markTaskComplete) top.markTaskComplete();
        if (top && top.markActiveComplete) top.markActiveComplete();
      } catch (e) {}
    }
    maybeShowQuiz();
    document.getElementById('hud').textContent =
      'chapter=' + n + '  tab=' + window.__tab + '  t=' + v.currentTime.toFixed(1) + '/' + DUR +
      '  paused=' + v.paused + '  ended=' + v.ended + '  playCalls=' + window.__playCalls +
      '  quizShown=' + window.__quizShown + '  quizSolved=' + window.__quizSolved;
  }, 250);
</script>
</body>
</html>
